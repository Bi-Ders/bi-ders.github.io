name = "biders-r2-upload"
main = "src/index.ts"
compatibility_date = "2026-11-21"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
persist = true
head_sampling_rate = 1

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[vars]
PUBLIC_CDN_URL = "https://cdn.biders.org"
# Ücretsiz 10 GB R2 kotasını aşmamak için toplam bucket güvenlik sınırı (~8 GB)
MAX_BUCKET_SIZE_BYTES = "8000000000"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "biders-media"
jurisdiction = "eu"
preview_bucket_name = "biders-media-preview"

routes = [{ pattern = "upload.biders.org", custom_domain = true }]

# Gizli ortam değişkenlerini (secrets) Wrangler ile tanımlayın:
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_ANON_KEY

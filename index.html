    <!-- Start Single Page Apps for GitHub Pages -->
    <!--
      GitHub Pages, /forum gibi alt sayfalar yenilendiğinde 404.html sunar.
      public/404.html yolu sorgu dizgisine (?/forum) çevirip buraya yönlendirir;
      bu betik ise React Router devreye girmeden önce doğru URL'yi geri yükler.
      MIT Lisansı — https://github.com/rafgraph/spa-github-pages
      Cloudflare Pages'te public/_redirects kullanıldığı için bu betik hiçbir şey yapmaz.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          )
        }
      })(window.location)
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
